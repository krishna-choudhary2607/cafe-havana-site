<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Table QR Codes</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background: #f4f4f4;
            padding: 20px;
        }
        .controls {
            margin-bottom: 20px;
        }
        .controls input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
        }
        .controls button {
            padding: 10px 20px;
            font-size: 16px;
            background: #d4af37;
            border: none;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .qr-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            page-break-inside: avoid;
        }
        .qr-card img {
            width: 100%;
            height: auto;
        }
        .qr-card h2 {
            margin: 10px 0 0;
            font-size: 1.5rem;
            color: #333;
        }
        .qr-card p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #666;
        }
        
        @media print {
            body { background: white; padding: 0; }
            .controls { display: none; }
            .grid { gap: 10px; }
            .qr-card { box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>
    <div class="controls">
        <h2>Generate Table QR Codes</h2>
        <p>Enter your website URL below (e.g., https://cafe-havana-site.onrender.com) and click Generate.</p>
        <input type="text" id="baseUrl" placeholder="https://yourwebsite.com">
        <button onclick="generateQRs()">Generate</button>
        <button onclick="window.print()" style="background: #333; color: white;">Print</button>
    </div>

    <div class="grid" id="qrGrid"></div>

    <script>
        // Auto-detect current URL if possible
        const currentUrl = window.location.origin;
        if(currentUrl && !currentUrl.includes('localhost')) {
            document.getElementById('baseUrl').value = currentUrl;
        }

        async function generateQRs() {
            let baseUrl = document.getElementById('baseUrl').value.trim();
            if(!baseUrl) return alert('Please enter your website URL');
            if(baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

            const password = prompt("Enter Admin Password to generate Secure QR Codes:");
            if (!password) return;

            try {
                const response = await fetch('/api/table-tokens', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (!response.ok) {
                    throw new Error('Invalid Admin Password');
                }

                const data = await response.json();
                const tokens = data.tokens;

                const grid = document.getElementById('qrGrid');
                grid.innerHTML = '';

                for(let i = 1; i <= 20; i++) {
                    const token = tokens[i];
                    const tableUrl = `${baseUrl}/?table=${i}&token=${token}`;
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(tableUrl)}`;
                    
                    grid.innerHTML += `
                        <div class="qr-card">
                            <img src="${qrUrl}" alt="Table ${i} QR" loading="lazy">
                            <h2>Table ${i}</h2>
                            <p>Scan to Order</p>
                            <button class="regenerate-btn" onclick="regenerateToken(${i})" style="margin-top: 10px; background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Regenerate</button>
                        </div>
                    `;
                }
            } catch (err) {
                alert(err.message || "Failed to fetch secure tokens.");
            }
        }
        
        async function regenerateToken(tableNumber) {
            if(!confirm(`Are you sure you want to regenerate the QR code for Table ${tableNumber}? The old printed QR code will stop working immediately!`)) return;
            
            const password = prompt("Enter Admin Password to confirm regeneration:");
            if (!password) return;
            
            try {
                const response = await fetch('/api/table-tokens/regenerate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, tableNumber })
                });

                if (!response.ok) {
                    throw new Error('Invalid Admin Password or Server Error');
                }
                
                alert(`Successfully generated new secure QR code for Table ${tableNumber}. Please re-print your codes!`);
                // Re-render all QR codes to show the new one
                document.getElementById('qrGrid').innerHTML = ''; // Force redraw
                generateQRs(); // This will prompt password again, but it's fine for security, or we could just pass the cached password. Actually let's just let it be for now. Wait, I should avoid double prompting.
            } catch (err) {
                alert(err.message || "Failed to regenerate token.");
            }
        }
    </script>
</body>
</html>
