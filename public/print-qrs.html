<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Table QR Codes</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background: #f4f4f4;
            padding: 20px;
        }
        .controls {
            margin-bottom: 20px;
        }
        .controls input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
        }
        .controls button {
            padding: 10px 20px;
            font-size: 16px;
            background: #d4af37;
            border: none;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .qr-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            page-break-inside: avoid;
        }
        .qr-card img {
            width: 100%;
            height: auto;
        }
        .qr-card h2 {
            margin: 10px 0 0;
            font-size: 1.5rem;
            color: #333;
        }
        .qr-card p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #666;
        }
        
        @media print {
            body { background: white; padding: 0; }
            .controls { display: none; }
            .grid { gap: 10px; }
            .qr-card { box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>
    <div class="controls">
        <h2>Manage Table QR Codes</h2>
        <p>Enter your website URL below (e.g., https://cafe-havana-site.onrender.com) and click Load.</p>
        <div style="margin-bottom: 10px;">
            <input type="text" id="baseUrl" placeholder="https://yourwebsite.com">
            <button onclick="generateQRs()">Load / Refresh</button>
            <button onclick="window.print()" style="background: #333; color: white;">Print All</button>
        </div>
        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
            <input type="number" id="newTableNumber" placeholder="Specific Table # (Optional)" style="width: 220px;">
            <button onclick="addTable()" style="background: #27ae60; color: white;">+ Add New Table</button>
        </div>
    </div>

    <div class="grid" id="qrGrid"></div>

    <script>
        // Auto-detect current URL if possible
        const currentUrl = window.location.origin;
        if(currentUrl && !currentUrl.includes('localhost')) {
            document.getElementById('baseUrl').value = currentUrl;
        }

        let currentPassword = '';

        async function getPassword() {
            if (currentPassword) return currentPassword;
            const pwd = prompt("Enter Admin Password:");
            if (pwd) currentPassword = pwd;
            return currentPassword;
        }

        async function generateQRs() {
            let baseUrl = document.getElementById('baseUrl').value.trim();
            if(!baseUrl) return alert('Please enter your website URL');
            if(baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

            const password = await getPassword();
            if (!password) return;

            try {
                const response = await fetch('/api/table-tokens', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (!response.ok) {
                    currentPassword = ''; // reset on failure
                    throw new Error('Invalid Admin Password');
                }

                const data = await response.json();
                const tokens = data.tokens;

                const grid = document.getElementById('qrGrid');
                grid.innerHTML = '';

                const tableNumbers = Object.keys(tokens).map(Number).sort((a, b) => a - b);

                tableNumbers.forEach(i => {
                    const token = tokens[i];
                    const tableUrl = `${baseUrl}/?table=${i}&token=${token}`;
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(tableUrl)}`;
                    
                    grid.innerHTML += `
                        <div class="qr-card">
                            <img src="${qrUrl}" alt="Table ${i} QR" loading="lazy">
                            <h2>Table ${i}</h2>
                            <p>Scan to Order</p>
                            <div style="margin-top: 10px; display: flex; gap: 5px; justify-content: center;">
                                <button onclick="regenerateToken(${i})" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Regenerate</button>
                                <button onclick="removeTable(${i})" style="background: #333; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Remove</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                alert(err.message || "Failed to fetch secure tokens.");
            }
        }
        
        async function addTable() {
            const password = await getPassword();
            if (!password) return;
            
            const tableInput = document.getElementById('newTableNumber').value;
            const payload = { password };
            if (tableInput) payload.tableNumber = parseInt(tableInput, 10);
            
            try {
                const response = await fetch('/api/table-tokens/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Server Error');
                }
                
                const data = await response.json();
                alert(`Added Table ${data.newTableNumber}!`);
                document.getElementById('newTableNumber').value = '';
                generateQRs();
            } catch(err) {
                alert(err.message);
            }
        }

        async function removeTable(tableNumber) {
            if(!confirm(`Are you sure you want to PERMANENTLY REMOVE Table ${tableNumber}?`)) return;
            const password = await getPassword();
            if (!password) return;
            
            try {
                const response = await fetch('/api/table-tokens/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, tableNumber })
                });
                if (!response.ok) throw new Error('Failed to delete table');
                
                generateQRs();
            } catch(err) {
                alert(err.message);
            }
        }

        async function regenerateToken(tableNumber) {
            if(!confirm(`Are you sure you want to regenerate the QR code for Table ${tableNumber}? The old printed QR code will stop working immediately!`)) return;
            
            const password = await getPassword();
            if (!password) return;
            
            try {
                const response = await fetch('/api/table-tokens/regenerate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, tableNumber })
                });

                if (!response.ok) {
                    throw new Error('Invalid Admin Password or Server Error');
                }
                
                alert(`Successfully generated new secure QR code for Table ${tableNumber}. Please re-print your codes!`);
                generateQRs();
            } catch (err) {
                alert(err.message || "Failed to regenerate token.");
            }
        }
    </script>
</body>
</html>
